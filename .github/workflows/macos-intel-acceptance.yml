name: macOS Acceptance Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-package:
    name: Test and package ${{ matrix.platform }} DMG
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            python_archive: FRAMEQ_PYTHON_STANDALONE_URL_MACOS_X64
            ffmpeg_archive: FRAMEQ_FFMPEG_ARCHIVE_URL_MACOS_X64
            ffprobe_archive: FRAMEQ_FFPROBE_ARCHIVE_URL_MACOS_X64
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
            python_archive: FRAMEQ_PYTHON_STANDALONE_URL_ARM64
            ffmpeg_archive: FRAMEQ_FFMPEG_ARCHIVE_URL_ARM64
            ffprobe_archive: FRAMEQ_FFPROBE_ARCHIVE_URL_ARM64
    env:
      APP_PYTHON_STANDALONE_URL: ${{ secrets[matrix.python_archive] }}
      APP_FFMPEG_ARCHIVE_URL: ${{ secrets[matrix.ffmpeg_archive] }}
      APP_FFPROBE_ARCHIVE_URL: ${{ secrets[matrix.ffprobe_archive] }}
    steps:
      - name: Checkout exact acceptance commit
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup native Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Setup Python 3.12 for real process tests
        id: process-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Build isolated system WebView host and test native protocol
        run: |
          node scripts/build-system-webview-host.mjs --target ${{ matrix.platform }}
          node scripts/build-system-webview-host.mjs --test-protocol

      - name: Run native macOS Rust acceptance
        env:
          RUST_BACKTRACE: "1"
          APP_PROCESS_TEST_PYTHON: ${{ steps.process-python.outputs.python-path }}
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Confirm required runtime archives are configured
        run: |
          for variable in \
            APP_PYTHON_STANDALONE_URL \
            APP_FFMPEG_ARCHIVE_URL \
            APP_FFPROBE_ARCHIVE_URL
          do
            if [ -z "${!variable}" ]; then
              echo "A required macOS runtime archive is unavailable." >&2
              exit 1
            fi
          done

      - name: Prepare bundled runtime resources
        run: node scripts/build-installer.mjs --target ${{ matrix.platform }} --skip-tauri-build

      - name: Verify packaged worker matches canonical source
        run: node scripts/verify-packaged-worker.mjs

      - name: Build internal macOS app bundle
        run: >-
          npm --prefix app run tauri -- build --bundles app
          --target ${{ matrix.target }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Extract, save and reopen real static and dynamic pages
        env:
          RUST_BACKTRACE: "1"
          APP_PROCESS_TEST_PYTHON: ${{ steps.process-python.outputs.python-path }}
        run: >-
          cargo test --manifest-path app/src-tauri/Cargo.toml --target ${{ matrix.target }}
          real_system_webview_static_and_dynamic_notes_are_saved_and_reopened -- --ignored --nocapture

      - name: Verify native architecture and packaged runtime
        run: |
          APP="app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Locus.app"
          RES="$APP/Contents/Resources/resources"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          BIN="$APP/Contents/MacOS/$EXECUTABLE"
          test -f "$BIN"
          file "$BIN"
          test "$(lipo -archs "$BIN")" = "${{ matrix.arch }}"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$RES/worker" "$RES/python/bin/python3" -c "import funasr_onnx, modelscope, onnxruntime, yt_dlp; import worker_core; print('bundled runtime import OK')"
          test -f "$RES/python/runtime-manifest.json"
          DENO_NO_UPDATE_CHECK=1 DENO_DIR="$RUNNER_TEMP/app-deno-cache" "$RES/bin/deno" eval "console.log('bundled deno OK')"
          if find "$RES" \( -name __pycache__ -o -name '*.pyc' \) | grep -q .; then
            echo "Packaged runtime smoke test mutated the app bundle." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$APP"
          node scripts/build-system-webview-host.mjs --target ${{ matrix.platform }} --verify-bundle "$APP"

      - name: Package internal macOS DMG
        run: bash scripts/make-macos-dmg.sh ${{ matrix.target }} Locus

      - name: Verify final DMG and contained application
        run: |
          DMG="$(find app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG"
          hdiutil verify "$DMG"
          MOUNT="$PWD/build/dmg-acceptance/${{ matrix.platform }}"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT"' EXIT
          codesign --verify --deep --strict --verbose=4 "$MOUNT/Locus.app"
          node scripts/build-system-webview-host.mjs --target ${{ matrix.platform }} --verify-bundle "$MOUNT/Locus.app"

      - name: Generate artifact identity and SHA-256
        id: artifact
        run: |
          DMG="$(find app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          echo "name=app-${{ matrix.platform }}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Upload internal macOS DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
