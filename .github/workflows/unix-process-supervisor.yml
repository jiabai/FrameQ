name: Native ProcessSupervisor

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "worker/**"
      - "contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
      - "scripts/build-system-webview-host.mjs"
      - "scripts/check-i18n-literals.mjs"
      - ".github/workflows/unix-process-supervisor.yml"
  pull_request:
    paths:
      - "app/**"
      - "worker/**"
      - "contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
      - "scripts/build-system-webview-host.mjs"
      - "scripts/check-i18n-literals.mjs"
      - ".github/workflows/unix-process-supervisor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unix-process-supervisor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-checks:
    name: Desktop checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      TMPDIR: ${{ github.workspace }}/build/desktop-checks/tmp
      TEMP: ${{ github.workspace }}/build/desktop-checks/tmp
      TMP: ${{ github.workspace }}/build/desktop-checks/tmp
      UV_CACHE_DIR: ${{ github.workspace }}/build/desktop-checks/uv-cache
      RUFF_CACHE_DIR: ${{ github.workspace }}/build/desktop-checks/ruff-cache
      NPM_CONFIG_CACHE: ${{ github.workspace }}/build/desktop-checks/npm-cache
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare test directories
        run: mkdir -p build/desktop-checks/tmp build/desktop-checks/uv-cache build/desktop-checks/ruff-cache build/desktop-checks/npm-cache

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install locked Worker, ASR and development dependencies
        run: uv sync --frozen --dev --extra pytorch --python 3.12

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run complete frontend tests
        run: npm --prefix app test

      - name: Check frontend types and localized copy
        run: npm --prefix app run lint

      - name: Check Worker Python style
        run: uv run --frozen --extra pytorch ruff check worker

      - name: Run complete Worker tests
        run: >-
          uv run --frozen --extra pytorch python -m pytest worker/tests
          --basetemp build/desktop-checks/pytest-temp -o cache_dir=build/desktop-checks/pytest-cache

  cargo-test:
    name: Cargo tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Build native system WebView host
        run: node scripts/build-system-webview-host.mjs

      - name: Test macOS native host protocol
        if: runner.os == 'macOS'
        run: node scripts/build-system-webview-host.mjs --test-protocol

      - name: Test Windows native host
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path app/native-webview-host/windows/Cargo.toml

      - name: Setup Python 3.12 for real process tests
        id: process-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Tauri Rust tests
        env:
          RUST_BACKTRACE: "1"
          APP_PROCESS_TEST_PYTHON: ${{ steps.process-python.outputs.python-path }}
        run: cargo test --manifest-path app/src-tauri/Cargo.toml
